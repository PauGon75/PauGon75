# Daily refresh of the profile card, the Pac-Man board and the link buttons.
name: Update Profile Card

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "assets/**"
      - ".github/workflows/profile-card.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/fetch_stats.py
      - name: Rebuild SVGs
        run: |
          python tools/build_card.py
          python tools/build_pacman.py
          python tools/build_links.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.svg' cache
          git diff --cached --quiet || (git commit -m "chore: refresh profile card" && git pull --rebase origin main && git push)
